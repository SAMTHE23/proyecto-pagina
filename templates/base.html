<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Inicio{% endblock %} | Autobots Concesionario de Vehículos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.0.0/css/fabric.min.css">
<link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>

  <header>
    <div class="logo">
      <img class="logo-icon" src="{{ imagen_url('logo.png') }}" alt="Logo Autobots">
      Autobots
    </div>
    <nav>
      <ul>
        <li><a href="{{ url_for('home') }}">Inicio</a></li>
        <li><a href="{{ url_for('catalogo') }}">Catálogo</a></li>
        <li><a href="{{ url_for('servicios') }}">Servicios</a></li>
        <li><a href="{{ url_for('contacto') }}">Contacto</a></li>
      </ul>
    </nav>
    <div class="header-right">
      <form class="buscador" action="{{ url_for('catalogo') }}" method="get">
        <input type="search" name="q" placeholder="Buscar marca o modelo" value="{{ request.query_params.get('q', '') }}">
       <button type="submit" aria-label="Buscar">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
</button>
      </form>
    </div>
  </header>

  <main>
    {% block contenido %}{% endblock %}
  </main>

   <footer>
    <div class="footer-links">
      <a href="{{ url_for('home') }}">Inicio</a>
      <a href="{{ url_for('catalogo') }}">Catálogo</a>
      <a href="{{ url_for('servicios') }}">Servicios</a>
      <a href="{{ url_for('contacto') }}">Contacto</a>
    </div>
    
    <hr class="footer-divisor">
    &copy; 2026 Autobots
  </footer>

</body>
</html>
